<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown</title>
</head>
<style>
 
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            background-color: #333;
        }

       .menu {
            display: flex;
            list-style: none;
        }

       .menu > li {
            position: relative;
        }

          .menu a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
        }

        .menu a:hover {
            background-color: #555;
        }

         .submenu {
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #333;
            list-style: none;
            width: 160px;

            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: 0.3s ease;
        }

        .dropdown:hover .submenu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .submenu a {
            padding: 12px 15px;
        } 
</style>
<body> 
    <nav>

       
    
   
        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li class="dropdown"><a href="#">Services</a>
                <ul class="submenu">
                     <li><a href="#">Web Design</a></li>
                     <li><a href="#">App Design</a></li>
                </ul>
            </li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
