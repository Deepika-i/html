<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioData</title>
</head>
<body>
    <form>
    <label for="name" id="name-label">Name:</label>
    <input type="text" id="name" name="name" required><br><br>
    <label for="email" id="email-label">Email:</label>
    <input type="email" id="email" name="email" required><br><br>
    <label for="age" id="age-label">Age:</label>
    <input type="number" id="age" name="age" min="1" required><br><br>
    <label for="gender" id="gender-label">Gender:</label>
     <select id="gender" name="gender" required>  
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
    </select><br><br>
    <label for="degree" id="degree-label">Degree:<br>
    <input type="radio" id="bca" name="degree" value="bca" required>
    <label for="bca">BCA</label><br>
    <input type="radio" id="bsc" name="degree" value="bsc" required>
    <label for="bsc">BSc</label><br>
    <input type="radio" id="bcom" name="degree" value="bcom" required>
    <label for="bcom">BCom</label><br><br>

    </label>


   
    <input type="submit" value="Submit">
    </form>
</body>
</html>
