<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testimonials</title>
</head>
<style>
    body
    {
        margin: 0;
    }
    .container img
    {
        width: 100px;
        height: 100px;
      
    }
    .testimonials
    {
        display: grid;
        place-items: center;
        padding: 50px;
    }
    .container
    {
        display: flex;
        gap :20px;
       
    }
    .card
    {
         border: 2px solid black;
         border-radius: 20px;
         display: grid;
         place-items: center;
         padding: 20px;

    }
</style>
<body>
    <section class="testimonials">
        <h1>Our customer Says</h1>
        <div class="container">
            <div class="card">
                <img src="priya.avif" alt="Priya">
                <h2>Priya</h2>
                <p>"Amazing Service and Beutiful Design"</p>
            </div>
            <div class="card">
                <img src="Divya.avif" alt="Divya">
                <h2>Divya</h2>
                <p>"I loved the product and serivices"</p>
            </div>
            <div class="card">
                <img src="Arun.jpeg" alt="Arun">
                <h2>Arun</h2>
                <p>"Very Good Experience,Highly Satisfied"</p>
            </div>
        </div>
    </section>
</body>
</html>
