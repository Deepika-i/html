<!DOCTYPE html>
<html>
<head>
    <title>Button Hover Effect</title>

    <style>
        button {
            background-color: blue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;

            
        }

        button:hover {
            background-color: green;
            transform: scale(1.1);
            transition: 0.3s;
        }
    </style>
</head>

<body>

    <button>Click Me</button>

</body>
</html>
