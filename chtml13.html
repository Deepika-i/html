<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sticky footer</title>
</head>
<style>
    html,body
    {
        height: 100%;
        margin:0;
    }
    body
    {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 10px;
        
    }
    main
    {
        flex:1;
    }
</style>
<body>
    <header>
        <h1>My website</h1>
    </header>
    <main>
        <p>Welcome</p>
        <p>This is a short Content </p>

        
    </main>
    <footer>
        <p>&copy;2026 My Website</p>
    </footer>

</body>
</html>
